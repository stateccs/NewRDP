name: RDP
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable RDP & Open Firewall
        run: |
          # Enable Remote Desktop
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          
          # Disable NLA (required for reliable connection)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          
          # Remove old rule if exists
          netsh advfirewall firewall delete rule name="GitHub-RDP" 2>$null
          
          # Open port 3389
          netsh advfirewall firewall add rule name="GitHub-RDP" dir=in action=allow protocol=TCP localport=3389
          
          Restart-Service TermService -Force

      - name: Create Admin RDP User + Mask Password
        shell: pwsh
        run: |
          $password = -join ((33..126) | Get-Random -Count 32 | % {[char]$_})
          $secPass = ConvertTo-SecureString $password -AsPlainText -Force

          New-LocalUser -Name "runneradmin" -Password $secPass -FullName "RDP Admin" -Description "Temp GitHub RDP" -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "runneradmin"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin"

          # This hides the password from logs
          Write-Output "::add-mask::$password"
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Start Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          version: latest
          args: --operator=${{ runner.name }} --hostname=gh-runner-${{ github.run_id }}

      - name: Get Tailscale IP
        id: ts
        shell: pwsh
        run: |
          $ip = tailscale ip -4 | Select-Object -First 1 | ForEach-Object Trim
          if (!$ip) { exit 1 }
          echo "ip=$ip" >> $env:GITHUB_OUTPUT

      - name: Test RDP Port
        shell: pwsh
        run: |
          $result = Test-NetConnection -ComputerName ${{ steps.ts.outputs.ip }} -Port 3389 -WarningAction SilentlyContinue
          if (-not $result.TcpTestSucceeded) {
            Write-Error "Port 3389 is not open!"
            exit 1
          }

      - name: RDP Ready - Keep Runner Alive
        shell: pwsh
        run: |
          Write-Host @"

          =================================================
                     RDP SESSION READY
          =================================================
          Tailscale IP   : ${{ steps.ts.outputs.ip }}:3389
          Username       : runneradmin
          Password       : ${{ env.RDP_PASSWORD }}
          -------------------------------------------------
          Connect via Windows RDP, Remmina, or any client
          (You must be in the same Tailscale network)
          =================================================

          "@

          $totalMinutes = 355
          for ($i = 0; $i -lt $totalMinutes; $i += 5) {
            $remaining = ($totalMinutes - $i) / 60
            Write-Host "[$(Get-Date -Format HH:mm:ss)] Session active - ~$([math]::Round($remaining, 1)) hours left (or cancel workflow)"
            Start-Sleep -Seconds 300
          }
